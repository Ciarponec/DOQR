name: doqr_app
description: DOQR Flutter app (owner/shared user client)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  qr_code_scanner_plus: ^2.0.10
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/doqr_icon.png"
  adaptive_icon_background: "#0A2A66"
  adaptive_icon_foreground: "assets/doqr_icon.png"

