name: doqr_app
description: DOQR Flutter app (owner/shared user client)
publish_to: "none"
version: 1.0.0+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^2.6.1
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_webrtc: ^1.6.1
  uuid: ^4.6.0
  in_app_purchase: ^3.3.0
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/doqr_icon.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/doqr_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#111936"
  adaptive_icon_foreground: "assets/doqr_icon.png"

