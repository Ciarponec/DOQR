<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DOQR Visitor Chat</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 12px}
    #messages{border:1px solid #ddd;min-height:260px;padding:8px;overflow:auto}
    input,button{padding:10px;font-size:16px}
    .row{display:flex;gap:8px;margin-top:8px}
    .row input{flex:1}
  </style>
</head>
<body>
  <h1>DOQR Chat</h1>
  <div id="messages"></div>
  <div class="row">
    <input id="msg" placeholder="Mesaj" />
    <button id="send">Gonder</button>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://wlfspfxyykdxpfhjqpkg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZnNwZnh5eWtkeHBmaGpxcGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTkzMjcsImV4cCI6MjA5MzM3NTMyN30.dCZX4qm3ynKObG4dMvwo_vcQPK_LWmE-RyCiMU-shaE';

    const p = new URLSearchParams(location.search);
    const ringId = p.get('ring_id');
    const visitorSessionToken = p.get('visitor_session_token');

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const messages = document.getElementById('messages');
    const msg = document.getElementById('msg');

    function render(list) {
      messages.innerHTML = list.map(m => `<div><b>${m.sender_type}</b>: ${m.message_text}</div>`).join('');
      messages.scrollTop = messages.scrollHeight;
    }

    async function load() {
      const { data } = await supabase.from('chat_messages').select('*').eq('ring_id', ringId).order('created_at');
      render(data || []);
    }

    document.getElementById('send').onclick = async () => {
      const text = msg.value.trim();
      if (!text) return;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/visitor-chat-send`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ring_id: ringId, visitor_session_token: visitorSessionToken, message_text: text })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Send failed'); return; }
      msg.value = '';
      await load();
    };

    await load();
    supabase.channel('chat-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`ring_id=eq.${ringId}`},()=>load()).subscribe();
  </script>
</body>
</html>
